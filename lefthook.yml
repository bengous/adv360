pre-commit:
  commands:
    fix-and-format:
      run: .claude/hooks/fix-and-format.sh --commit {staged_files}
      stage_fixed: true

pre-push:
  commands:
    # Every local commit no origin ref holds, whichever branch is pushed.
    gitleaks:
      run: gitleaks git --no-banner --redact --log-opts="--branches --not --remotes=origin" .
